plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}

version = '0.2.0'
group = 'com.yanbu3.horrorheads'
archivesBaseName = 'Yanbu3-Horror-Heads-Forge-1.19.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        client {
            workingDirectory project.file('run')
            mods { yanbu3_horror_heads { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { yanbu3_horror_heads { source sourceSets.main } }
        }
    }
}

repositories { }

dependencies { minecraft 'net.minecraftforge:forge:1.19.2-43.5.0' }

jar {
    manifest {
        attributes(['Specification-Title': 'yanbu3_horror_heads', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version])
    }
    finalizedBy 'reobfJar'
}
