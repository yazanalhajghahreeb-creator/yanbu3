name: Build Meteor Rain JAR
on:
  push:
    paths:
      - 'meteor-rain/**'
      - '.github/workflows/build-meteor-rain.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Confirm Java source exists
        run: test -f meteor-rain/src/main/java/com/yanbu33/meteorrain/MeteorRain.java
      - name: Compile and package Fabric mod
        working-directory: meteor-rain
        run: gradle clean build --no-daemon
      - name: Verify entrypoint is actually inside JAR
        run: |
          jar tf meteor-rain/build/libs/meteor-rain-1.0.5.jar | grep -Fx 'com/yanbu33/meteorrain/MeteorRain.class'
          unzip -p meteor-rain/build/libs/meteor-rain-1.0.5.jar fabric.mod.json | grep -F 'com.yanbu33.meteorrain.MeteorRain'
      - uses: actions/upload-artifact@v4
        with:
          name: meteor-rain-fixed-1.0.5
          path: meteor-rain/build/libs/meteor-rain-1.0.5.jar
          if-no-files-found: error
