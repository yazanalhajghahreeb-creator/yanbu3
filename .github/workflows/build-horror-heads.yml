name: Build Horror Heads Forge 1.19.2

on:
  push:
    paths:
      - 'minecraft-horror-heads/v0.2.0/**'
      - '.github/workflows/build-horror-heads.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-horror-heads/v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3'
      - name: Compile and reobfuscate using ForgeGradle
        run: gradle --no-daemon clean build --stacktrace
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: Yanbu3-Horror-Heads-Forge-1.19.2-v0.2.0
          path: minecraft-horror-heads/v0.2.0/build/libs/*.jar
          if-no-files-found: error
