name: Build Yanbu3 Horror Optimized v1.0.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-horror-stars/build_horror_optimized_pack.py'
      - '.github/workflows/build-horror-optimized-v102.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the full Modrinth pack from verified upstream files
        run: python minecraft-horror-stars/build_horror_optimized_pack.py

      - name: Upload import-ready Modrinth pack
        uses: actions/upload-artifact@v4
        with:
          name: Yanbu3-Horror-Optimized-v1.0.2-Forge-1.19.2
          path: minecraft-horror-stars/Yanbu3_Horror_Optimized_v1.0.2_Forge_1.19.2.mrpack
          if-no-files-found: error
          retention-days: 90
